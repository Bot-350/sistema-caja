services:
  - type: web
    name: sistema-caja
    runtime: node
    buildCommand: npm install && npm run build
    startCommand: echo "Build complete"
    
  - type: web
    name: sistema-caja-php
    runtime: php
    runtimeVersion: 8.3
    buildCommand: composer install && cp -r ../sistema-caja/public/build ./public/
    startCommand: php -S 0.0.0.0:$PORT -t public
    envVars:
      - key: APP_ENV
        value: production
      - key: APP_DEBUG
        value: false
      - key: DB_CONNECTION
        value: sqlite
      - key: LOG_CHANNEL
        value: stderr
      - key: SESSION_DRIVER
        value: database
      - key: CACHE_STORE
        value: database
      - key: QUEUE_CONNECTION
        value: database
      - key: APP_KEY
        generateValue: true
      - key: APP_URL
        fromService:
          type: web
          name: sistema-caja
          property: url
